name: Verify and land Utility OS Phase 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack Phase 1
        shell: bash
        run: |
          set -euo pipefail
          cat .phase1/part* > /tmp/phase1.b64
          base64 -d /tmp/phase1.b64 > /tmp/phase1.tar.gz
          echo "7ff44b5218bd254a462c6b56dd6ea7e50187b7380684547a7f68d9653a9c20e4  /tmp/phase1.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/phase1.tar.gz -C .
          rm -rf .phase1
          rm -f .github/workflows/bootstrap-phase1.yml .github/workflows/bootstrap-lock.yml

      - name: Lock dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Security lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit verified Phase 1 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Utility OS Phase 1"
          git push origin HEAD:main
