name: Verify and land Utility OS Phase 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack Phase 1
        shell: bash
        run: |
          set -euo pipefail
          cat .phase1/part* > /tmp/phase1.b64
          base64 -d /tmp/phase1.b64 > /tmp/phase1.tar.gz
          echo "7ff44b5218bd254a462c6b56dd6ea7e50187b7380684547a7f68d9653a9c20e4  /tmp/phase1.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/phase1.tar.gz -C .
          rm -rf .phase1
          rm -f .github/workflows/bootstrap-phase1.yml .github/workflows/bootstrap-lock.yml

      - name: Apply compiler hardening fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found: {path}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "src/components/image/ImageStudio.tsx",
              "const abortRef = useRef<AbortController>();",
              "const abortRef = useRef<AbortController | undefined>(undefined);",
          )
          replace_exact(
              "src/components/image/ImageStudio.tsx",
              """        if (result.state === 'completed' && result.result) {
          if (accumulatedOutput + result.result.blob.size > SECURITY_LIMITS.maxZipBytes) {
            patchItem(item.id, { state: 'failed', message: 'Batch output memory budget reached. Earlier files remain available.' });
            return;
          }
          accumulatedOutput += result.result.blob.size;
          const outputUrl = URL.createObjectURL(result.result.blob);
          setItems((current) => current.map((currentItem) => {
            if (currentItem.id !== item.id) return currentItem;
            if (currentItem.outputUrl) URL.revokeObjectURL(currentItem.outputUrl);
            return {
              ...currentItem,
              state: 'completed',
              output: result.result,
              outputUrl,
              message: result.result.warning
            };
          }));""",
              """        if (result.state === 'completed' && result.result) {
          const output = result.result;
          if (accumulatedOutput + output.blob.size > SECURITY_LIMITS.maxZipBytes) {
            patchItem(item.id, { state: 'failed', message: 'Batch output memory budget reached. Earlier files remain available.' });
            return;
          }
          accumulatedOutput += output.blob.size;
          const outputUrl = URL.createObjectURL(output.blob);
          setItems((current) => current.map((currentItem) => {
            if (currentItem.id !== item.id) return currentItem;
            if (currentItem.outputUrl) URL.revokeObjectURL(currentItem.outputUrl);
            return {
              ...currentItem,
              state: 'completed',
              output,
              outputUrl,
              message: output.warning
            };
          }));""",
          )
          replace_exact(
              "src/components/image/ImageStudio.tsx",
              "downloadOne(done[0]);",
              "downloadOne(done[0]!);",
          )
          replace_exact(
              "src/workers/image.worker.ts",
              "const blob = new Blob([bytes], { type: mime });",
              """const copy = new ArrayBuffer(bytes.byteLength);
  new Uint8Array(copy).set(bytes);
  const blob = new Blob([copy], { type: mime });""",
          )
          replace_exact(
              "src/workers/zip.worker.ts",
              """const zipped = zipSync(entries, { level: 6 });
    const blob = new Blob([zipped], { type: 'application/zip' });""",
              """const zipped = zipSync(entries, { level: 6 });
    const copy = new ArrayBuffer(zipped.byteLength);
    new Uint8Array(copy).set(zipped);
    const blob = new Blob([copy], { type: 'application/zip' });""",
          )
          PY

      - name: Lock dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Security lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit verified Phase 1 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Utility OS Phase 1"
          git push origin HEAD:main
