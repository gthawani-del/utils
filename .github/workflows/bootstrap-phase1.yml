name: Bootstrap Utility OS Phase 1

on:
  push:
    branches: [main]
    paths:
      - '.phase1/**'
      - '.github/workflows/bootstrap-phase1.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack Phase 1
        shell: bash
        run: |
          set -euo pipefail
          cat .phase1/part* > /tmp/phase1.b64
          base64 -d /tmp/phase1.b64 > /tmp/phase1.tar.gz
          echo "1690ae518a0a8509a6dfc545b94714e615efa7d57363a5b742621e9f03d7303c  /tmp/phase1.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/phase1.tar.gz -C .
          rm -rf .phase1
          rm -f .github/workflows/bootstrap-phase1.yml .github/workflows/bootstrap-lock.yml

      - name: Lock dependencies
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci

      - name: Security lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit verified Phase 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Utility OS Phase 1"
          git push

# bootstrap-trigger: phase1-finalize
