<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Browse Utility OS image editing, publishing and creation tools.">
  <title>Image tools · Utility OS</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/home.css">
  <link rel="stylesheet" href="/assets/catalog.css">
</head>
<body class="home-body directory-body" data-category="images">
  <header class="directory-header">
    <a class="directory-brand" href="/" aria-label="Utility OS home"><span class="directory-brand-mark">U</span>Utility OS</a>
    <a class="directory-text" href="/">All categories</a>
  </header>
  <main class="directory-main directory-product">
    <section class="directory-intro" aria-labelledby="category-heading">
      <div><a class="directory-breadcrumb" href="/">Home</a><h1 id="category-heading">Image tools</h1><p id="category-description">Edit, resize and prepare images for wherever they need to go.</p></div>
      <div class="directory-search"><label for="category-search">Find an image tool</label><input type="search" id="category-search" autocomplete="off" placeholder="Try resize, WebP or watermark"></div>
    </section>
    <section id="images-art-feature" aria-labelledby="images-art-title">
      <div class="directory-art-hero">
        <div class="directory-art-copy">
          <h2 id="images-art-title">Algorithmic Drawing</h2>
          <p>Start with an idea or open an example. Make it yours with color, composition, and variations.</p>
          <a class="primary-button" href="/image/algorithmic-drawing">Create artwork <span aria-hidden="true">→</span></a>
        </div>
        <img src="/assets/art/midnight-flow.webp" width="800" height="450" alt="Blue and gold strands crossing on a midnight-blue background">
      </div>
      <div id="images-art-examples" class="directory-art-examples" aria-label="Editable artwork examples"></div>
    </section>
    <div id="category-filters" class="directory-filters" role="group" aria-label="Filter image tools"></div>
    <section id="category-results" class="directory-catalog-grid" aria-label="Image tools"></section>
    <p id="category-result-count" class="visually-hidden" role="status"></p>
    <footer class="directory-footer">Utility OS · No account needed</footer>
  </main>
  <script type="module" src="/assets/catalog.js"></script>
</body>
</html>
